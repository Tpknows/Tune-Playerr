async function importPlaylistById(playlistId, suggestedName) {
  const status = document.getElementById('importYtStatus');
  const createBtn = document.getElementById('createPlaylistBtn');
  createBtn.disabled = true;

  status.textContent = 'Scraping YouTube playlist (no quota)...';
  status.className = 'import-yt-status';

  let allTracks = await scrapePlaylist(playlistId);

  if (allTracks.length === 0) {
    status.textContent = 'Scraping failed — trying API fallback...';
    try {
      let pageToken = '';
      do {
        const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${encodeURIComponent(playlistId)}${pageToken ? '&pageToken=' + pageToken : ''}`;
        const data = await fetchYT(url);
        const items = (data.items || []).filter(it => it.snippet?.resourceId?.videoId);
        allTracks.push(...items.map(it => ({
          id: it.snippet.resourceId.videoId,
          title: decodeHtmlEntities(it.snippet.title),
          channel: decodeHtmlEntities(it.snippet.videoOwnerChannelTitle || it.snippet.channelTitle || ''),
          thumb: (it.snippet.thumbnails?.medium || it.snippet.thumbnails?.default)?.url || ''
        })));
        pageToken = data.nextPageToken || '';
      } while (pageToken);
    } catch (e) {
      status.textContent = 'Import failed.';
      status.className = 'import-yt-status error';
      createBtn.disabled = false;
      return;
    }
  }

  if (allTracks.length === 0) {
    status.textContent = 'No tracks found.';
    status.className = 'import-yt-status error';
    createBtn.disabled = false;
    return;
  }

  let name = suggestedName || 'Imported Playlist';
  let finalName = name, n = 2;
  while (playlists[finalName]) { finalName = `${name} (${n})`; n++; }

  playlists[finalName] = allTracks;
  savePlaylists();
  renderPlaylistNav();

  status.textContent = `✅ Imported ${allTracks.length} tracks as "${finalName}"`;
  status.className = 'import-yt-status success';

  setTimeout(() => {
    closeModal('newPlaylistModal');
    showPlaylist(finalName);
  }, 800);
}

async function scrapePlaylist(playlistId) {
  try {
    const url = `https://www.youtube.com/playlist?list=${playlistId}`;
    const res = await fetch(url, {
      headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
    });
    if (!res.ok) throw new Error('Failed to load');
    const html = await res.text();
    const tracks = [];
    const patterns = [
      /"videoId":"([^"]+)".*?"title":{"simpleText":"([^"]+)"}/g,
      /videoId\\":\\"([^"]+)\\".*?title\\":\{[^}]*?"text\\":\\"([^"]+)"\\}/g
    ];
    for (const regex of patterns) {
      let match;
      while ((match = regex.exec(html)) !== null) {
        const id = match[1];
        const title = decodeHtmlEntities(match[2]);
        if (id && title && !tracks.some(t => t.id === id)) {
          tracks.push({
            id,
            title,
            channel: 'Scraped',
            thumb: `https://i.ytimg.com/vi/${id}/mqdefault.jpg`
          });
        }
      }
    }
    return tracks;
  } catch (e) {
    console.error(e);
    return [];
  }
}
